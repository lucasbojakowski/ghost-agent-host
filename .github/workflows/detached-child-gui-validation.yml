name: Detached Child GUI Validation
on:
  push:
    branches: [fix/detached-child-gui-hosting]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format working tree
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-features
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test focused host crates
        run: cargo test -p ghost-core -p ghost-host --all-features
      - name: Upload formatted GUI sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detached-child-gui-formatted-sources
          path: |
            crates/ghost-host/src/native.rs
            crates/ghost-clap-plugin/src/child_window.rs
          if-no-files-found: error
          retention-days: 3
