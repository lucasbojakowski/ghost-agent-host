name: Reconcile runtime workspace

on:
  push:
    branches:
      - feat/fl-runtime-shell

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit reconciled files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "workspace already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/ghost-fl-runtime/src/main.rs
          git commit -m "build: reconcile runtime workspace"
          git push origin HEAD:feat/fl-runtime-shell
