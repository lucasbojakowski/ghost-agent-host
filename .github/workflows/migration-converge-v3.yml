name: Migration converge v3

on:
  push:
    branches: [phase/vertical-slice-reset]

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/vertical-slice-reset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply migration cleanup and narrow follow-up fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          workflow = Path('.github/workflows/migration-converge.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          body = workflow[start:end]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"
          script = Path('/tmp/ghost-migrate.py')
          script.write_text(body)
          subprocess.run(['python3', str(script)], check=True)

          lib = Path('crates/ghost-codex/src/lib.rs')
          text = lib.read_text()
          old = 'pub use transport::*;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete transport re-export, found {text.count(old)}')
          lib.write_text(text.replace(old, ''))

          parallel = Path('crates/ghost-codex/src/parallel.rs')
          text = parallel.read_text()
          pattern = re.compile(
              r'        let context = CompiledContext \{.*?        let output = collect_turn_output\("turn-a", receiver, &context, &mut \|_\| \{\}\)\.unwrap\(\);',
              re.S,
          )
          replacement = '''        let input = TurnInput {
              text: String::new(),
              output_schema: Some(json!({"type": "object"})),
          };
          let output = collect_turn_output("turn-a", receiver, &input, &mut |_| {}).unwrap();'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one CompiledContext test block, replaced {count}')
          parallel.write_text(text)
          PY
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Validate converged workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-features
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          git diff --check
      - name: Commit converged workspace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Converge migrated Rust workspace"
          git push origin HEAD:phase/vertical-slice-reset
