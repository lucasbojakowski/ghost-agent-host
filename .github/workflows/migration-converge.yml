name: Migration converge

on:
  push:
    branches: [phase/vertical-slice-reset]

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/vertical-slice-reset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply mechanical migration cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          # Retire final ghost-core naming and graph-era residue from the proven Tap implementation.
          replace("crates/ghost-tap/src/lib.rs", "extern crate self as ghost_core;\n\n", "")
          replace("crates/ghost-tap/src/plugin.rs", "[`ghost_core::RealtimeCaptureBuffer`]", "[`crate::RealtimeCaptureBuffer`]")
          replace("crates/ghost-tap/src/plugin.rs", "use ghost_core::{", "use crate::{")
          replace(
              "crates/ghost-tap/src/realtime.rs",
              "#[derive(Default)]\npub struct AtomicGraphControl {\n    bypass_mask: AtomicU64,\n}\n\nimpl AtomicGraphControl {\n    pub fn set_bypass_mask(&self, mask: u64) {\n        self.bypass_mask.store(mask, Ordering::Release);\n    }\n\n    pub fn is_bypassed(&self, bit: u64) -> bool {\n        self.bypass_mask.load(Ordering::Acquire) & bit != 0\n    }\n}\n\n",
              "",
          )
          replace(
              "crates/ghost-tap/src/realtime.rs",
              "pub fn capture_post_tap_key(node_id: &str) -> u64 {\n    let hash = capture_key_bytes(0xcbf29ce484222325, \"post:\".bytes());\n    capture_key_bytes(hash, node_id.bytes())\n}\n\n",
              "",
          )

          # Promote the executable name fully.
          replace("apps/ghost-workflow/src/main.rs", 'name = "ghost-fl-workflow"', 'name = "ghost-workflow"')

          # Remove the superseded serialized App Server host; the concurrent runtime owns all required operations.
          lib = Path("crates/ghost-codex/src/lib.rs")
          text = lib.read_text()
          text = text.replace("mod app_server;\n", "")
          text = text.replace("pub use app_server::*;\n", "")
          lib.write_text(text)
          Path("crates/ghost-codex/src/app_server.rs").unlink()

          # Strip the old replaceable serialized transport surface while retaining the split stdio runtime.
          transport = Path("crates/ghost-codex/src/transport.rs")
          text = transport.read_text()
          start = text.index("/// Replaceable app-server wire boundary.")
          end = text.index("/// Split stdio ownership for the concurrent App Server runtime.")
          text = text[:start] + text[end:]
          start = text.index("impl RpcTransport for StdioTransport {")
          end = text.index("#[cfg(all(test, target_os = \"windows\"))]", start)
          text = text[:start] + text[end:]
          transport.write_text(text)

          # Domain-neutral turn boundary; no Ghost context type or historical one-agent trait in ghost-codex.
          Path("crates/ghost-codex/src/runtime.rs").write_text('''use serde_json::Value;\n\n#[derive(Debug, Clone, PartialEq)]\npub struct TurnInput {\n    pub text: String,\n    pub output_schema: Option<Value>,\n}\n\n#[derive(Debug, Clone)]\npub struct TurnOptions {\n    pub effort: String,\n    pub summary: String,\n    pub approval_policy: String,\n    pub sandbox_policy: Value,\n}\n\nimpl Default for TurnOptions {\n    fn default() -> Self {\n        Self {\n            effort: \"high\".into(),\n            summary: \"concise\".into(),\n            approval_policy: \"never\".into(),\n            sandbox_policy: serde_json::json!({\n                \"type\": \"readOnly\",\n                \"access\": { \"type\": \"fullAccess\" }\n            }),\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub enum AgentEvent {\n    TurnStarted {\n        turn_id: Option<String>,\n    },\n    ItemStarted {\n        item: Value,\n    },\n    ItemCompleted {\n        item: Value,\n    },\n    TurnCompleted {\n        status: String,\n    },\n    Other {\n        method: Option<String>,\n        payload: Value,\n    },\n}\n\nimpl AgentEvent {\n    pub(crate) fn from_wire(message: &Value) -> Self {\n        let method = message.get(\"method\").and_then(Value::as_str);\n        match method {\n            Some(\"turn/started\") => Self::TurnStarted {\n                turn_id: message\n                    .pointer(\"/params/turn/id\")\n                    .and_then(Value::as_str)\n                    .map(str::to_owned),\n            },\n            Some(\"item/started\") => Self::ItemStarted {\n                item: message\n                    .pointer(\"/params/item\")\n                    .cloned()\n                    .unwrap_or(Value::Null),\n            },\n            Some(\"item/completed\") => Self::ItemCompleted {\n                item: message\n                    .pointer(\"/params/item\")\n                    .cloned()\n                    .unwrap_or(Value::Null),\n            },\n            Some(\"turn/completed\") => Self::TurnCompleted {\n                status: message\n                    .pointer(\"/params/turn/status\")\n                    .and_then(Value::as_str)\n                    .unwrap_or(\"unknown\")\n                    .to_owned(),\n            },\n            _ => Self::Other {\n                method: method.map(str::to_owned),\n                payload: message.clone(),\n            },\n        }\n    }\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct AgentOutput {\n    pub text: String,\n    pub structured: Option<Value>,\n}\n''')

          parallel = Path("crates/ghost-codex/src/parallel.rs")
          text = parallel.read_text()
          text = text.replace("use ghost_context::{CompiledContext, OutputContract};\n", "")
          text = text.replace(
              "normalize_output_schema, resolve_codex_binary, AgentError, AgentEvent, AgentOutput, ToolRegistry,\n    TurnOptions,",
              "normalize_output_schema, resolve_codex_binary, AgentError, AgentEvent, AgentOutput, ToolRegistry,\n    TurnInput, TurnOptions,",
          )
          text = text.replace('service_name: Some("ghost_agent_host".into()),', 'service_name: None,')
          text = text.replace('"name": "ghost_agent_host",\n                    "title": "Ghost Agent Host",', '"name": "ghost_codex",\n                    "title": "Ghost Codex Runtime",')
          text = text.replace("context: &CompiledContext,", "input: &TurnInput,")
          text = text.replace('"input": [{"type": "text", "text": context.text()}],', '"input": [{"type": "text", "text": input.text.clone()}],')
          text = text.replace(
              "if let OutputContract::Json { schema, .. } = &context.output {\n            let mut schema = schema.clone();",
              "if let Some(schema) = &input.output_schema {\n            let mut schema = schema.clone();",
          )
          text = text.replace("collect_turn_output(&turn_id, receiver, context, events)", "collect_turn_output(&turn_id, receiver, input, events)")
          text = text.replace(
              "    context: &CompiledContext,\n    events: &mut dyn FnMut(AgentEvent),",
              "    input: &TurnInput,\n    events: &mut dyn FnMut(AgentEvent),",
          )
          text = text.replace(
              "    let structured = match &context.output {\n        OutputContract::Text => None,\n        OutputContract::Json { .. } => Some(serde_json::from_str(&text)?),\n    };",
              "    let structured = if input.output_schema.is_some() {\n        Some(serde_json::from_str(&text)?)\n    } else {\n        None\n    };",
          )
          parallel.write_text(text)

          cargo = Path("crates/ghost-codex/Cargo.toml")
          text = cargo.read_text().replace('ghost-context = { path = "../ghost-context" }\n', '')
          cargo.write_text(text)

          # Adapt Ghost context to the provider-neutral Codex input in the concrete app.
          app = Path("apps/ghost-workflow/src/main.rs")
          text = app.read_text()
          text = text.replace("    TurnOptions,", "    TurnInput, TurnOptions,")
          old = '''    let output = runtime.run_turn(\n        &thread,\n        &context,\n        &TurnOptions::default(),\n        &mut |event| print_agent_event(&event, cli.verbose_agent_events),\n    )?;'''
          new = '''    let turn_input = TurnInput {\n        text: context.text(),\n        output_schema: match &context.output {\n            OutputContract::Text => None,\n            OutputContract::Json { schema, .. } => Some(schema.clone()),\n        },\n    };\n    let output = runtime.run_turn(\n        &thread,\n        &turn_input,\n        &TurnOptions::default(),\n        &mut |event| print_agent_event(&event, cli.verbose_agent_events),\n    )?;'''
          if old not in text:
              raise SystemExit("apps/ghost-workflow/src/main.rs: run_turn block did not match")
          app.write_text(text.replace(old, new))

          # Fail if key retired names remain in source/manifests.
          retired = ["ghost_core", "AtomicGraphControl", "ghost_agent_host", "ghost-context = { path = \"../ghost-context\" }"]
          roots = [Path("crates"), Path("apps"), Path("tools")]
          for root in roots:
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in {".rs", ".toml"}:
                      data = p.read_text(errors="ignore")
                      for token in retired:
                          if token in data:
                              raise SystemExit(f"retired token {token!r} remains in {p}")
          PY
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Validate converged workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-features
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          git diff --check
      - name: Commit converged workspace
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Converge migrated Rust workspace"
          git push origin HEAD:phase/vertical-slice-reset
