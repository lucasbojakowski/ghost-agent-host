name: Apply runtime lifecycle refactor

on:
  push:
    branches:
      - feat/fl-runtime-shell

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply lifecycle refactor
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/ghost-fl-runtime/src/main.rs")
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"missing patch anchor: {old[:80]!r}")

          def replace_block(start_marker, end_marker, new_block):
              global text
              if new_block in text:
                  return
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"missing block start: {start_marker}")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"missing block end: {end_marker}")
              text = text[:start] + new_block.rstrip() + "\n\n" + text[end:]

          replace_once(
              '    #[arg(long, default_value = "127.0.0.1:48750")]\n    bind: String,\n',
              '    #[arg(long, default_value = "127.0.0.1:48750")]\n    bind: String,\n\n    #[arg(long)]\n    no_webviews: bool,\n',
          )

          replace_once(
              '    app_child: Arc<Mutex<Option<Child>>>,\n    journal: EventJournal,\n',
              '    app_child: Arc<Mutex<Option<Child>>>,\n    runtime_ui_child: Arc<Mutex<Option<Child>>>,\n    app_ui_child: Arc<Mutex<Option<Child>>>,\n    bootstrap_active: Arc<AtomicBool>,\n    journal: EventJournal,\n',
          )

          replace_once(
              '            app_child: Arc::new(Mutex::new(None)),\n            journal,\n',
              '            app_child: Arc::new(Mutex::new(None)),\n            runtime_ui_child: Arc::new(Mutex::new(None)),\n            app_ui_child: Arc::new(Mutex::new(None)),\n            bootstrap_active: Arc::new(AtomicBool::new(false)),\n            journal,\n',
          )

          replace_once(
              '        self.start_app()?;\n        self.wait_for_app_ready()?;\n        self.transition(\n',
              '        self.start_app()?;\n        self.wait_for_app_ready()?;\n        self.open_app_webview();\n        self.transition(\n',
          )

          replace_once(
              '        if self.cli.no_app {\n            bail!("runtime was started with --no-app");\n        }\n        self.stop_app(false)?;\n',
              '        if self.cli.no_app {\n            bail!("runtime was started with --no-app");\n        }\n        {\n            let state = self.state()?;\n            if state.fl.pid.is_none() || !state.fl.gopher_ready {\n                bail!("FL Studio and Gopher must be ready before starting the registered Ghost app");\n            }\n        }\n        self.stop_app(false)?;\n',
          )

          replace_block(
              '    fn ensure_app_still_running(&self) -> Result<()> {',
              '    fn stop_app(&self, record: bool) -> Result<()> {',
              '''    fn ensure_app_still_running(&self) -> Result<()> {
              let exited = {
                  let mut slot = lock(&self.app_child, "app child")?;
                  let child = slot
                      .as_mut()
                      .ok_or_else(|| anyhow!("registered app process is not running"))?;
                  match child.try_wait()? {
                      Some(status) => {
                          let pid = child.id();
                          *slot = None;
                          Some((pid, status))
                      }
                      None => None,
                  }
              };
              if let Some((pid, status)) = exited {
                  {
                      let mut state = self.state()?;
                      state.app.pid = None;
                      state.app.healthy = false;
                      state.app.thread_id = None;
                      state.app.last_error = Some(format!("registered app exited with {status}"));
                      if state.app.scripting_connected.is_some() {
                          state.app.scripting_connected = Some(false);
                      }
                  }
                  self.persist_state()?;
                  self.journal.append(
                      "app",
                      "app.exited",
                      "error",
                      json!({"pid": pid, "status": status.to_string()}),
                  )?;
                  bail!("registered app exited with {status}");
              }
              Ok(())
          }''',
          )

          replace_once(
              '        self.start_app()?;\n        self.wait_for_app_ready()?;\n        self.transition(RuntimePhase::Ready, "app.restart_complete", json!({}))\n',
              '        self.start_app()?;\n        self.wait_for_app_ready()?;\n        self.open_app_webview();\n        self.transition(RuntimePhase::Ready, "app.restart_complete", json!({}))\n',
          )

          replace_once(
              '        if self.cli.no_app {\n            return Ok(());\n        }\n        if let Err(error) = self.ensure_app_still_running() {\n',
              '        if self.cli.no_app {\n            return Ok(());\n        }\n        if self.state()?.app.pid.is_none() {\n            return Ok(());\n        }\n        if let Err(error) = self.ensure_app_still_running() {\n',
          )

          refresh_fl = '''    fn refresh_fl_health(&self) -> Result<()> {
              let fl = self.state()?.fl.clone();
              let Some(pid) = fl.pid else {
                  return Ok(());
              };
              if !process_is_running(pid)? {
                  return self.handle_fl_exit(pid);
              }
              if fl.gopher_ready
                  && probe_gopher(
                      self.cli.debug_port,
                      &self.cli.target_match,
                      Duration::from_millis(750),
                  )
                  .is_err()
              {
                  let changed = {
                      let mut state = self.state()?;
                      if !state.fl.gopher_ready {
                          false
                      } else {
                          state.fl.gopher_ready = false;
                          state.fl.gopher_target = None;
                          state.fl.gopher_tool_count = None;
                          if matches!(state.phase, RuntimePhase::Ready | RuntimePhase::Degraded) {
                              state.phase = RuntimePhase::Degraded;
                              state.last_error = Some("FL Studio Gopher target is unavailable".into());
                          }
                          state.updated_at_unix_ms = unix_ms();
                          true
                      }
                  };
                  if changed {
                      self.persist_state()?;
                      self.journal.append(
                          "fl.gopher",
                          "gopher.lost",
                          "warn",
                          json!({"pid": pid}),
                      )?;
                  }
              }
              Ok(())
          }

          fn handle_fl_exit(&self, pid: u32) -> Result<()> {
              self.stop_app(false)?;
              self.stop_webview(&self.app_ui_child, "app")?;
              let error = format!("FL Studio process {pid} exited");
              {
                  let mut state = self.state()?;
                  state.fl.pid = None;
                  state.fl.launched_by_ghost = false;
                  state.fl.window_ready = false;
                  state.fl.gopher_ready = false;
                  state.fl.gopher_target = None;
                  state.fl.gopher_tool_count = None;
                  state.app.last_error = Some("FL Studio is unavailable".into());
                  if !matches!(state.phase, RuntimePhase::Stopping | RuntimePhase::Stopped) {
                      state.phase = RuntimePhase::Degraded;
                  }
                  state.last_error = Some(error.clone());
                  state.updated_at_unix_ms = unix_ms();
              }
              self.persist_state()?;
              self.journal.append(
                  "fl.process",
                  "fl.exited",
                  "error",
                  json!({"pid": pid, "error": error}),
              )
          }'''
          if refresh_fl not in text:
              anchor = '    fn mark_degraded(&self, error: String) -> Result<()> {'
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit("missing mark_degraded anchor")
              text = text[:idx] + refresh_fl + "\n\n" + text[idx:]

          replace_block(
              '    fn start_monitor(&self) {',
              '    fn open_gopher_now(&self) -> Result<()> {',
              '''    fn start_monitor(&self) {
              let runtime = self.clone();
              thread::Builder::new()
                  .name("ghost-fl-runtime-monitor".into())
                  .spawn(move || {
                      while !runtime.shutdown.load(Ordering::Relaxed) {
                          for result in [runtime.refresh_fl_health(), runtime.refresh_health()] {
                              if let Err(error) = result {
                                  eprintln!("[ghost-fl-runtime] monitor warning: {error:#}");
                                  let _ignored = runtime.journal.append(
                                      "runtime",
                                      "monitor.warning",
                                      "warn",
                                      json!({"error": format!("{error:#}")}),
                                  );
                              }
                          }
                          thread::sleep(Duration::from_secs(1));
                      }
                  })
                  .expect("failed to spawn runtime monitor");
          }''',
          )

          replace_block(
              '    fn serve(&self) -> Result<()> {',
              '    fn handle_http(&self, stream: &mut TcpStream) -> Result<()> {',
              '''    fn start_server(&self) -> Result<()> {
              let listener = TcpListener::bind(&self.cli.bind).with_context(|| {
                  format!("failed to bind runtime control panel at {}", self.cli.bind)
              })?;
              listener.set_nonblocking(true)?;
              println!("[ghost-fl-runtime] control panel: http://{}", self.cli.bind);
              let runtime = self.clone();
              thread::Builder::new()
                  .name("ghost-fl-runtime-http".into())
                  .spawn(move || {
                      if let Err(error) = runtime.serve_listener(listener) {
                          eprintln!("[ghost-fl-runtime] HTTP server failed: {error:#}");
                          runtime.fail(&error);
                          runtime.shutdown.store(true, Ordering::Relaxed);
                      }
                  })
                  .context("failed to spawn runtime HTTP server")?;
              Ok(())
          }

          fn serve_listener(&self, listener: TcpListener) -> Result<()> {
              while !self.shutdown.load(Ordering::Relaxed) {
                  match listener.accept() {
                      Ok((mut stream, _)) => {
                          if let Err(error) = self.handle_http(&mut stream) {
                              eprintln!("[ghost-fl-runtime] HTTP request failed: {error:#}");
                              let response = json!({"error": error.to_string()});
                              let _ignored =
                                  send_json(&mut stream, "500 Internal Server Error", &response);
                          }
                      }
                      Err(error) if error.kind() == ErrorKind::WouldBlock => {
                          thread::sleep(Duration::from_millis(50));
                      }
                      Err(error) => return Err(error.into()),
                  }
              }
              Ok(())
          }

          fn start_bootstrap(&self) -> Result<()> {
              if self.bootstrap_active.swap(true, Ordering::AcqRel) {
                  return Ok(());
              }
              let runtime = self.clone();
              let spawn = thread::Builder::new()
                  .name("ghost-fl-runtime-bootstrap".into())
                  .spawn(move || {
                      if let Err(error) = runtime.bootstrap() {
                          eprintln!("[ghost-fl-runtime] FL bootstrap failed: {error:#}");
                          runtime.fail(&error);
                      }
                      runtime.bootstrap_active.store(false, Ordering::Release);
                  });
              if let Err(error) = spawn {
                  self.bootstrap_active.store(false, Ordering::Release);
                  return Err(error).context("failed to spawn runtime bootstrap thread");
              }
              Ok(())
          }

          fn run(&self) -> Result<()> {
              self.start_server()?;
              self.open_runtime_webview();
              self.start_monitor();
              self.start_bootstrap()?;
              while !self.shutdown.load(Ordering::Relaxed) {
                  thread::sleep(Duration::from_millis(100));
              }
              self.teardown()
          }

          fn open_runtime_webview(&self) {
              let url = format!("http://{}", self.cli.bind);
              if let Err(error) = self.spawn_webview(
                  &self.runtime_ui_child,
                  &url,
                  "Ghost & Guild · FL Runtime",
                  1180,
                  820,
                  "runtime",
              ) {
                  eprintln!("[ghost-fl-runtime] runtime webview failed: {error:#}");
                  let _ignored = self.journal.append(
                      "ui",
                      "ui.webview_failed",
                      "warn",
                      json!({"kind": "runtime", "error": format!("{error:#}")}),
                  );
              }
          }

          fn open_app_webview(&self) {
              if self.cli.no_app {
                  return;
              }
              let endpoint = match self.state() {
                  Ok(state) => state.app.endpoint.clone(),
                  Err(error) => {
                      eprintln!("[ghost-fl-runtime] app webview state read failed: {error:#}");
                      return;
                  }
              };
              let url = format!("http://{endpoint}");
              let title = format!("Ghost & Guild · {}", self.cli.app.spec().display_name);
              if let Err(error) = self.spawn_webview(
                  &self.app_ui_child,
                  &url,
                  &title,
                  1280,
                  900,
                  "app",
              ) {
                  eprintln!("[ghost-fl-runtime] app webview failed: {error:#}");
                  let _ignored = self.journal.append(
                      "ui",
                      "ui.webview_failed",
                      "warn",
                      json!({"kind": "app", "error": format!("{error:#}")}),
                  );
              }
          }

          fn spawn_webview(
              &self,
              slot: &Arc<Mutex<Option<Child>>>,
              url: &str,
              title: &str,
              width: u32,
              height: u32,
              kind: &str,
          ) -> Result<()> {
              if self.cli.no_webviews {
                  return Ok(());
              }
              #[cfg(not(windows))]
              {
                  let _ = (slot, url, title, width, height, kind);
                  return Ok(());
              }
              #[cfg(windows)]
              {
                  self.stop_webview(slot, kind)?;
                  let helper = env::current_exe()?
                      .with_file_name(format!("ghost-fl-runtime-webview{}", env::consts::EXE_SUFFIX));
                  if !helper.is_file() {
                      bail!("runtime webview helper is unavailable at {}", helper.display());
                  }
                  let child = Command::new(&helper)
                      .arg(url)
                      .arg(title)
                      .arg(width.to_string())
                      .arg(height.to_string())
                      .spawn()
                      .with_context(|| format!("failed to spawn {} webview at {}", kind, helper.display()))?;
                  let pid = child.id();
                  *lock(slot, "webview child")? = Some(child);
                  self.journal.append(
                      "ui",
                      "ui.webview_started",
                      "info",
                      json!({"kind": kind, "pid": pid, "url": url}),
                  )?;
                  Ok(())
              }
          }

          fn stop_webview(
              &self,
              slot: &Arc<Mutex<Option<Child>>>,
              kind: &str,
          ) -> Result<()> {
              let mut slot = lock(slot, "webview child")?;
              if let Some(mut child) = slot.take() {
                  let pid = child.id();
                  if child.try_wait()?.is_none() {
                      let _ignored = child.kill();
                      let _ignored = child.wait();
                  }
                  self.journal.append(
                      "ui",
                      "ui.webview_stopped",
                      "info",
                      json!({"kind": kind, "pid": pid}),
                  )?;
              }
              Ok(())
          }''',
          )

          replace_once(
              '            ("POST", "/api/app/start") => {\n                self.start_app()?;\n                self.wait_for_app_ready()?;\n                self.transition(RuntimePhase::Ready, "app.start_complete", json!({}))?;\n',
              '            ("POST", "/api/app/start") => {\n                self.start_app()?;\n                self.wait_for_app_ready()?;\n                self.open_app_webview();\n                self.transition(RuntimePhase::Ready, "app.start_complete", json!({}))?;\n',
          )

          replace_once(
              '            ("POST", "/api/gopher/open") => {\n                self.open_gopher_now()?;\n                let state = self.state()?.clone();\n                send_json(stream, "200 OK", &state)\n            }\n',
              '            ("POST", "/api/gopher/open") => {\n                self.open_gopher_now()?;\n                let state = self.state()?.clone();\n                send_json(stream, "200 OK", &state)\n            }\n            ("POST", "/api/fl/retry") => {\n                self.start_bootstrap()?;\n                let state = self.state()?.clone();\n                send_json(stream, "202 Accepted", &state)\n            }\n',
          )

          replace_once(
              '        self.transition(RuntimePhase::Stopping, "runtime.stopping", json!({}))?;\n        self.stop_app(true)?;\n',
              '        self.transition(RuntimePhase::Stopping, "runtime.stopping", json!({}))?;\n        self.stop_webview(&self.app_ui_child, "app")?;\n        self.stop_app(true)?;\n',
          )

          replace_once(
              '        self.transition(RuntimePhase::Stopped, "runtime.stopped", json!({}))\n',
              '        self.stop_webview(&self.runtime_ui_child, "runtime")?;\n        self.transition(RuntimePhase::Stopped, "runtime.stopped", json!({}))\n',
          )

          process_fn = '''#[cfg(windows)]
          fn process_is_running(pid: u32) -> Result<bool> {
              let output = powershell_output(&format!(
                  "$p = Get-Process -Id {pid} -ErrorAction SilentlyContinue; if ($p) {{ '1' }}"
              ))?;
              Ok(output.trim() == "1")
          }

          #[cfg(not(windows))]
          fn process_is_running(pid: u32) -> Result<bool> {
              let _ = pid;
              Ok(false)
          }

          '''
          if 'fn process_is_running(pid: u32)' not in text:
              anchor = 'fn wait_for_fl_window(pid: u32, timeout: Duration) -> Result<()> {'
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit("missing wait_for_fl_window anchor")
              text = text[:idx] + process_fn + text[idx:]

          replace_once(
              '        while Instant::now() < deadline {\n            let script = format!(\n',
              '        while Instant::now() < deadline {\n            if !process_is_running(pid)? {\n                bail!("FL Studio process {pid} exited while waiting for its main window");\n            }\n            let script = format!(\n',
          )

          replace_once(
              'fn main() -> Result<()> {\n    let runtime = Runtime::new(Cli::parse())?;\n    if let Err(error) = runtime.bootstrap() {\n        runtime.fail(&error);\n        return Err(error);\n    }\n    runtime.start_monitor();\n    runtime.serve()\n}\n',
              'fn main() -> Result<()> {\n    let runtime = Runtime::new(Cli::parse())?;\n    runtime.run()\n}\n',
          )

          path.write_text(text)
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit lifecycle refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "runtime lifecycle already refactored"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ghost-fl-runtime/src/main.rs Cargo.lock
          git commit -m "fix(runtime): make FL lifecycle supervised"
          git push origin HEAD:feat/fl-runtime-shell
