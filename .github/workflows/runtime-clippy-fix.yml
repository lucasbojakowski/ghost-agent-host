name: Apply runtime clippy cleanup

on:
  push:
    branches:
      - feat/fl-runtime-shell

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("apps/ghost-fl-runtime/src/main.rs"); t=p.read_text(); old="            return Ok(());\n        }\n        #[cfg(windows)]"; new="            Ok(())\n        }\n        #[cfg(windows)]"; assert old in t, "cleanup anchor missing"; p.write_text(t.replace(old, new, 1))'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ghost-fl-runtime/src/main.rs
          git commit -m "fix(runtime): satisfy lifecycle clippy"
          git push origin HEAD:feat/fl-runtime-shell
