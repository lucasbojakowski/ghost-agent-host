name: Native GUI Repair Validation
on:
  push:
    branches: [fix/native-gui-syntax]

permissions:
  contents: write

jobs:
  validate-and-format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format restored source
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-features
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test focused host crates
        run: cargo test -p ghost-core -p ghost-host --all-features
      - name: Commit formatted native source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ghost-host/src/native.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Format restored native CLAP GUI source"
          git push
