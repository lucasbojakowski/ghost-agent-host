[analysis]
profile = "maximum"
fft_sizes = [2048, 8192, 32768]
hop_ratio = 0.25
minimum_frequency_hz = 20.0
maximum_frequency_hz = 22000.0
resonance_threshold_db = 5.0
transient_sensitivity = 2.5
true_peak_oversample = 4
retain_frame_series = true

[capture]
default_bars = 8
minimum_seconds = 6.0
maximum_seconds = 20.0
silence_gate_dbfs = -60.0

[agent]
backend = "mock"
codex_binary = "codex"
model = "gpt-5.6-terra"
timeout_seconds = 120
system_prompt_path = "prompts/system.md"
output_mode = "structured"

[storage]
database_path = ".ghost/ghost.db"
artifact_root = ".ghost/artifacts"
retain_audio = true
compress_json = true

[host]
backend = "mock"
parameter_smoothing_ms = 25.0
search_default_clap_directories = true

[[host.roles]]
role = "equalizer"
capability = "audio.mix/equalizer.band"
preferred_plugin_id = ""

[[host.roles]]
role = "compressor"
capability = "audio.mix/compressor.settings"
preferred_plugin_id = ""
