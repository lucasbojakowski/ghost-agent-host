[workspace]
members = [
  "crates/ghost-core",
  "crates/ghost-context",
  "crates/ghost-application",
  "crates/ghost-codex",
  "crates/ghost-clap-plugin",
  "crates/ghost-fl-studio",
  "apps/ghost-fl-native-bridge",
  "apps/ghost-fl-agent-smoke",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false
authors = ["Konko"]
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3"
clack-plugin = "0.1.1"
clack-extensions = "0.1.1"
clack-common = "0.1.1"
ebur128 = "0.1"
hound = "3"
indexmap = { version = "2", features = ["serde"] }
realfft = "3"
schemars = { version = "1", features = ["derive", "uuid1", "indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-debug]
inherits = "release"
debug = 2
strip = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
