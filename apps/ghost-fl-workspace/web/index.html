<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Ghost Workspace</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="workspace-shell">
      <aside class="left-rail">
        <section class="rail-section project-summary">
          <button id="project-edit" class="project-title-button" type="button">
            <span class="eyebrow">PROJECT</span>
            <strong id="project-title">Untitled production</strong>
            <span id="project-meta" class="subtle">No thread selected</span>
          </button>
        </section>

        <section class="rail-section grow">
          <div class="rail-heading">
            <span>References</span>
            <button id="add-asset" class="icon-button" type="button" aria-label="Add audio path">+</button>
          </div>
          <div id="asset-list" class="asset-list"></div>
        </section>

        <section class="rail-section rail-actions">
          <button id="open-plan" class="rail-action" type="button"><span>Production plan</span><span>›</span></button>
          <button id="open-skills" class="rail-action" type="button"><span>Skills</span><span>›</span></button>
          <button id="open-threads" class="rail-action" type="button"><span>Threads</span><span id="thread-count" class="count-badge">0</span></button>
        </section>
      </aside>

      <main class="conversation-column">
        <header class="conversation-header">
          <button id="thread-button" class="thread-button" type="button">
            <span id="active-thread-name">New workspace</span>
            <span class="chevron">⌄</span>
          </button>
          <div id="turn-status" class="turn-status"></div>
        </header>

        <section id="messages" class="messages" aria-live="polite"></section>

        <div class="composer-dock">
          <div id="composer-assets" class="composer-assets"></div>
          <div class="composer">
            <textarea id="prompt" rows="1" placeholder="Ask Ghost to analyze, plan, inspect or build…"></textarea>
            <div class="composer-footer">
              <div class="composer-tools">
                <button id="composer-add-asset" class="composer-tool-button" type="button" title="Add reference or stem path">＋</button>
                <select id="model-select" class="composer-select" aria-label="Model"></select>
                <select id="effort-select" class="composer-select" aria-label="Reasoning effort">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high" selected>High</option>
                  <option value="xhigh">XHigh</option>
                </select>
              </div>
              <button id="send" class="send-button" type="button">Send</button>
            </div>
          </div>
        </div>
      </main>

      <aside class="right-rail">
        <div class="inspector-tabs" role="tablist">
          <button class="inspector-tab active" data-tab="fl" type="button">FL</button>
          <button class="inspector-tab" data-tab="analysis" type="button">Analysis</button>
          <button class="inspector-tab" data-tab="plan" type="button">Plan</button>
        </div>
        <div id="inspector-fl" class="inspector-panel active"></div>
        <div id="inspector-analysis" class="inspector-panel"></div>
        <div id="inspector-plan" class="inspector-panel"></div>
      </aside>
    </div>

    <dialog id="thread-dialog" class="workspace-dialog">
      <form method="dialog" class="dialog-card large-dialog">
        <div class="dialog-header">
          <div><span class="eyebrow">WORKSPACE</span><h2>Threads</h2></div>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <input id="thread-filter" class="field" type="search" placeholder="Filter by name or id…" />
        <div id="thread-list" class="thread-list"></div>
        <div class="dialog-actions split-actions">
          <button id="new-thread" type="button">New thread</button>
          <div>
            <button id="fork-thread" type="button">Fork</button>
            <button id="rename-thread" type="button">Rename</button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="asset-dialog" class="workspace-dialog">
      <form id="asset-form" method="dialog" class="dialog-card">
        <div class="dialog-header">
          <div><span class="eyebrow">REFERENCE</span><h2>Add audio path</h2></div>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <label class="field-label">Path<input id="asset-path" class="field" autocomplete="off" placeholder="D:\\client\\reference.wav" /></label>
        <label class="field-label">Label<input id="asset-label" class="field" autocomplete="off" placeholder="Reference mix" /></label>
        <label class="field-label">Role
          <select id="asset-role" class="field">
            <option value="reference_mix">Reference mix</option>
            <option value="drums">Drums</option>
            <option value="kick">Kick</option>
            <option value="snare">Snare</option>
            <option value="hihat">Hi-hat</option>
            <option value="percussion">Percussion</option>
            <option value="bass">Bass</option>
            <option value="music">Music</option>
            <option value="vocals">Vocals</option>
            <option value="fx">FX</option>
            <option value="other">Other</option>
          </select>
        </label>
        <div class="dialog-actions"><button value="cancel">Cancel</button><button id="save-asset" class="primary-button" value="default">Add</button></div>
      </form>
    </dialog>

    <dialog id="project-dialog" class="workspace-dialog">
      <form id="project-form" method="dialog" class="dialog-card">
        <div class="dialog-header">
          <div><span class="eyebrow">PROJECT</span><h2>Production context</h2></div>
          <button class="icon-button" value="cancel" aria-label="Close">×</button>
        </div>
        <label class="field-label">Title<input id="project-title-input" class="field" /></label>
        <div class="field-row">
          <label class="field-label">Tempo<input id="project-tempo" class="field" type="number" step="0.01" min="20" max="400" placeholder="128" /></label>
          <label class="field-label">Time signature<input id="project-time-signature" class="field" placeholder="4/4" /></label>
        </div>
        <label class="field-label">Producer description<textarea id="project-description" class="field description-field" rows="8" placeholder="Describe the reference, client direction, aesthetic, instrumentation, timbral language, structure, and anything the audio cannot tell Ghost by itself."></textarea></label>
        <div class="dialog-actions"><button value="cancel">Cancel</button><button id="save-project" class="primary-button" value="default">Save</button></div>
      </form>
    </dialog>

    <dialog id="skills-dialog" class="workspace-dialog">
      <div class="dialog-card large-dialog">
        <div class="dialog-header">
          <div><span class="eyebrow">WORKFLOWS</span><h2>Skills</h2></div>
          <button id="close-skills" class="icon-button" type="button" aria-label="Close">×</button>
        </div>
        <div id="skill-list" class="skill-list"></div>
        <article id="skill-content" class="skill-content markdown-body"></article>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
